<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vivi en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Monitor de signos vitales: el latido arriba, el reloj de vida como cifra principal, después lo que piensa y hace. */
:root {
  --bg: #f3f6f4; --panel: #ffffff; --fg: #15211c; --muted: #5b6b64; --line: #d9e2dd;
  --pulse: #0e7c66; --warn: #a8670d; --bad: #c0392b; --chip: #e7efeb;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0c1411; --panel: #121d19; --fg: #e2ebe6; --muted: #93a49c; --line: #23332c;
          --pulse: #43c7a5; --warn: #e3a43c; --bad: #f0715f; --chip: #1a2924; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.envuelto > * { min-width: 0; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
       padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.envuelto { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; letter-spacing: .02em; }
.etq { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
header.top h1 { font-size: 2rem; }
.pill { font: 600 .75rem var(--mono); letter-spacing: .06em; padding: 4px 10px; border-radius: 99px; background: var(--chip); color: var(--pulse); }
.pill.peligro { color: var(--warn); } .pill.muerta { color: var(--bad); }
.latido { flex: 1 1 220px; min-width: 0; height: 46px; }
.latido svg { width: 100%; height: 46px; display: block; }
.latido path { fill: none; stroke: var(--pulse); stroke-width: 2.2; stroke-linejoin: round; stroke-dasharray: 600; animation: barrido var(--vel, 2.4s) linear infinite; }
.peligro-c .latido path { stroke: var(--warn); } .muerta-c .latido path { stroke: var(--bad); animation: none; stroke-dasharray: none; }
@keyframes barrido { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .latido path { animation: none; stroke-dasharray: none; } }
.visto { color: var(--muted); font-size: .85rem; }
.reloj { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: end; }
.reloj .grande { font: 700 clamp(3.4rem, 12vw, 5.6rem)/0.9 var(--display); color: var(--pulse); }
.peligro-c .reloj .grande { color: var(--warn); } .muerta-c .reloj .grande { color: var(--bad); }
.barra { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--pulse); border-radius: 99px; }
.peligro-c .barra i { background: var(--warn); }
.signos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.signo .v { font: 600 1.45rem var(--mono); font-variant-numeric: tabular-nums; }
.dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
ul.lista { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ul.lista li { padding-left: 14px; border-left: 3px solid var(--line); overflow-wrap: anywhere; }
ul.lista li b { font-family: var(--mono); font-size: .8rem; color: var(--pulse); font-weight: 600; }
.ok li { border-left-color: var(--warn); }
blockquote { margin: 6px 0; padding: 8px 12px; background: var(--chip); border-radius: 8px; white-space: pre-wrap; }
button.copiar { font: 600 .75rem var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
button.copiar:focus-visible, a:focus-visible { outline: 2px solid var(--pulse); outline-offset: 2px; }
a { color: var(--pulse); }
.tabla { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
td.n, th.n { white-space: nowrap; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.chip { white-space: nowrap; font: 600 .7rem var(--mono); padding: 2px 7px; border-radius: 6px; background: var(--chip); }
.chip.baja { color: var(--bad); }
.grafico svg { width: 100%; height: 150px; display: block; }
.grafico rect { fill: var(--pulse); } .grafico text { fill: var(--muted); font: 10px var(--mono); }
.grafico line { stroke: var(--line); }
.muerte { white-space: pre-wrap; font-family: var(--mono); color: var(--bad); }
#llave { display: grid; gap: 10px; max-width: 520px; }
#llave input { font: 14px var(--mono); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.vacio { color: var(--muted); }
</style>
</head>
<body>
<div class="envuelto" id="app">
  <header class="top">
    <h1>Vivi</h1><span class="pill" id="pill">…</span>
    <div class="latido" aria-hidden="true"><svg viewBox="0 0 600 46" preserveAspectRatio="none"><path id="ecg" d="M0 23 H600"/></svg></div>
    <span class="visto" id="visto">Abriendo…</span>
  </header>
  <form id="llave" class="panel" hidden>
    <h2>Esta pantalla está cerrada</h2>
    <p>Abrila con el enlace completo que te pasó Vivi (termina en <span class="num">#k=…</span>), o pegá la clave acá.</p>
    <label class="etq" for="clave">Clave o enlace</label>
    <input id="clave" autocomplete="off" spellcheck="false">
    <button class="copiar" type="submit">Abrir</button>
    <p class="vacio" id="error"></p>
  </form>
  <main id="contenido" class="envuelto" hidden></main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => "USD " + Number(n || 0).toFixed(2);
const ars = n => "$ " + Number(n || 0).toLocaleString("es-AR");
const fecha = s => s ? new Date(s + (s.length === 10 ? "T12:00:00" : "")).toLocaleDateString("es-AR", {day: "2-digit", month: "2-digit", year: "numeric"}) : "—";
const TIPOS = {articulo: "artículo", precio_ml: "precio", publicidad: "publicidad", posteo: "posteo", idea: "idea"};

function guardada() { try { return localStorage.getItem("vivi-clave") || ""; } catch (e) { return ""; } }
function guardar(k) { try { localStorage.setItem("vivi-clave", k); } catch (e) {} }
function deEnlace(t) { const m = String(t).match(/#k=([A-Za-z0-9_-]+)/); return m ? m[1] : String(t).trim(); }
function b64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function abrir(k) {
  const r = await fetch("datos.json?t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error("Vivi todavía no subió sus datos.");
  const sobre = await r.json();
  const llave = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]);
  let plano;
  try { plano = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(sobre.iv)}, llave, b64(sobre.ct)); }
  catch (e) { throw new Error("La clave no abre estos datos. Usá el último enlace que te pasó Vivi."); }
  return JSON.parse(new TextDecoder().decode(plano));
}

function ecg(estado) {
  // un latido cada 120 px; muerta: línea plana
  if (estado === "muerta") return "M0 23 H600";
  let d = "M0 23";
  for (let x = 0; x < 600; x += 120) d += ` H${x + 40} l6 -4 l6 4 H${x + 60} l5 14 l7 -34 l6 26 l5 -6 H${x + 92} q6 -8 12 0 H${x + 120}`;
  return d;
}

function hace(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 2) return "recién";
  if (min < 90) return `hace ${min} min`;
  const h = Math.round(min / 60);
  return h < 36 ? `hace ${h} h` : `hace ${Math.round(h / 24)} días`;
}

function grafico(serie) {
  if (!serie || !serie.length) return `<p class="vacio">Todavía no hay visitas medidas: empiezan a contarse desde su primer día pensando.</p>`;
  const W = 600, H = 150, pie = 18, max = Math.max(1, ...serie.map(p => p.visitas));
  const paso = W / serie.length, ancho = Math.max(2, paso * 0.7);
  const barras = serie.map((p, i) => {
    const h = (H - pie - 12) * p.visitas / max, x = i * paso + (paso - ancho) / 2;
    return `<rect x="${x.toFixed(1)}" y="${(H - pie - h).toFixed(1)}" width="${ancho.toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${fecha(p.fecha)}: ${p.visitas} visitas</title></rect>`;
  }).join("");
  const ult = serie[serie.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas por día en Mercado Libre">
    <line x1="0" x2="${W}" y1="${H - pie}" y2="${H - pie}"/>${barras}
    <text x="0" y="${H - 4}">${fecha(serie[0].fecha)}</text>
    <text x="${W}" y="${H - 4}" text-anchor="end">${fecha(ult.fecha)} · ${ult.visitas}</text>
    <text x="0" y="10">máx. ${max}/día</text></svg>`;
}

function propuesta(x, i) {
  // los posteos vienen como líneas "> texto": van en un recuadro con su botón de copiar
  const partes = String(x.que).split("\n").map(l => l.trim()).filter(Boolean).map((l, j) => l.startsWith(">")
    ? `<blockquote id="t${i}-${j}">${esc(l.replace(/^>\s?/, ""))}</blockquote><button class="copiar" type="button" data-c="t${i}-${j}">Copiar</button>`
    : esc(l));
  return `<li><b>${esc(x.agente)}</b> ${esc(x.ref)}<br>${partes.join(" ")}</li>`;
}

function pintar(d) {
  const r = d.reloj, muerta = !!d.muerta;
  const estado = muerta ? "muerta" : (r && r.dias <= r.alerta ? "peligro" : "viva");
  document.body.className = estado + "-c";
  $("#pill").textContent = {muerta: "DESCONECTADA", peligro: "EN PELIGRO", viva: "VIVA"}[estado];
  $("#pill").className = "pill " + estado;
  $("#ecg").setAttribute("d", ecg(estado));
  document.documentElement.style.setProperty("--vel", estado === "peligro" ? "1.2s" : "2.4s");
  $("#visto").textContent = `último latido ${hace(d.actualizado)} · día ${d.dia} de vida`;
  const c = d.caja, pub = d.publicidad || {usado: 0, disponible: 0}, p = d.piensa || {};
  const v7 = (d.ml || []).reduce((s, f) => s + (f.visitas7 || 0), 0);
  const dr = d.dia_reporte || {};
  let h = "";
  if (muerta) h += `<section class="panel"><h2>Se apagó</h2><p class="muerte">${esc(d.muerta)}</p></section>`;
  if (r) {
    const usado = Math.min(1, Math.max(0, (r.total - Math.max(0, r.dias)) / r.total));
    h += `<section class="panel reloj"><div class="grande num">${Math.max(0, r.dias)}</div>
      <div><div class="etq">días para vender</div><div>Si no vende nada antes del <b>${fecha(r.limite)}</b>, la desconectan.
      ${c.ultima_venta ? `Última venta: ${fecha(c.ultima_venta)}.` : "Todavía no vendió nunca."}</div></div>
      <div class="barra" aria-label="Tiempo usado"><i style="width:${(100 - usado * 100).toFixed(1)}%"></i></div></section>`;
  }
  h += `<section class="signos">
    <div class="panel signo"><div class="etq">Facturado</div><div class="v">${usd(c.facturado)}</div></div>
    <div class="panel signo"><div class="etq">Caja</div><div class="v">${usd(c.saldo)}</div><div class="visto">fiado ${usd(c.fiado)}</div></div>
    <div class="panel signo"><div class="etq">Publicidad</div><div class="v">${usd(pub.usado)}</div><div class="visto">quedan ${usd(pub.disponible)}</div></div>
    <div class="panel signo"><div class="etq">Visitas ML · 7 días</div><div class="v">${v7}</div></div></section>`;
  const decisiones = (p.hoy || []).map(x => `<li><b>${esc(TIPOS[x.tipo] || x.tipo)}</b> ${esc(x.sobre)} — ${esc(x.por_que)}</li>`).join("");
  const resultados = (p.resultados || []).map(x => `<li><b>${fecha(x.fecha)} · ${esc(TIPOS[x.tipo] || x.tipo)}</b> ${esc(x.sobre)}: ${esc(x.resultado)}</li>`).join("");
  h += `<div class="dos"><section class="panel"><h2>Qué está pensando</h2>
      <p>${p.diagnostico ? esc(p.diagnostico) : '<span class="vacio">Todavía no pensó: lo hace una vez por día, en el ciclo de la mañana.</span>'}</p>
      <div class="etq">Decidió ${p.fecha === d.hoy ? "hoy" : (p.fecha ? "el " + fecha(p.fecha) : "")}</div>
      <ul class="lista">${decisiones || '<li class="vacio">nada todavía</li>'}</ul>
      ${resultados ? `<div class="etq" style="margin-top:14px">Cómo le fue a lo que probó</div><ul class="lista">${resultados}</ul>` : ""}
      ${(p.ideas || []).length ? `<div class="etq" style="margin-top:14px">Ideas que todavía no sabe hacer</div><ul class="lista">${p.ideas.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
    </section>
    <section class="panel"><h2>Necesita tu OK</h2>
      <ul class="lista ok">${(dr.propuestas || []).map(propuesta).join("") || '<li class="vacio">Nada por ahora.</li>'}</ul></section></div>`;
  h += `<section class="panel grafico"><h2>Visitas por día en Mercado Libre</h2>${grafico(d.visitas)}</section>`;
  if (d.prospectos) {
    const pr = d.prospectos;
    h += `<section class="panel"><h2>Clientes posibles</h2><p class="visto">${esc(pr.resumen)}. Vivi no le escribe a nadie: si una te interesa, mandale vos el mensaje.</p>
      <ul class="lista ok">${pr.lista.map((c, i) => `<li><b>${esc(c.rubro)} · nota ${c.nota}</b> <strong>${esc(c.nombre)}</strong> · ${esc(c.direccion || "AMBA")}<br>
        ${esc(c.por_que)}<br>Ofrecerle: ${esc(c.oferta)}${c.precio_ars ? ` · ${ars(c.precio_ars)}` : ""}${c.abono_ars ? ` + ${ars(c.abono_ars)}/mes` : ""}<br>
        ${[c.telefono && esc(c.telefono), c.email && esc(c.email), c.web && `<a href="${esc(/^https?:/.test(c.web) ? c.web : "https://" + c.web)}" rel="noopener">web</a>`,
           c.whatsapp && `<a href="${esc(c.whatsapp)}?text=${encodeURIComponent(c.mensaje)}" rel="noopener">abrir WhatsApp con el mensaje</a>`].filter(Boolean).join(" · ")}
        <blockquote id="p${i}">${esc(c.mensaje)}</blockquote><button class="copiar" type="button" data-c="p${i}">Copiar mensaje</button></li>`).join("")
        || '<li class="vacio">Todavía no encontró ninguna que valga la pena.</li>'}</ul></section>`;
  }
  if (d.hotmart) {
    const hm = d.hotmart;
    h += `<section class="panel"><h2>Hotmart</h2><p class="visto">${hm.conectada ? "Conectada: Vivi ve tus productos y ventas." :
      "Todavía sin conectar: Vivi arma los paquetes igual, pero no ve lo que subís ni las ventas."} · ${hm.ventas} venta(s)</p>
      <ul class="lista">${(hm.kits || []).map(k => `<li><b>${k.estado === "publicado" ? "publicado" : "para subir"}</b> ${esc(k.nombre)} · USD ${k.precio}
      ${k.estado !== "publicado" && k.carpeta ? ` · <a href="${esc(k.carpeta)}" rel="noopener">paquete (LEEME.txt)</a>` : ""}</li>`).join("")
      || '<li class="vacio">Todavía no armó paquetes.</li>'}</ul></section>`;
  }
  if (d.habilidades) {
    const hb = d.habilidades, ap = (d.piensa || {}).aprender || [];
    const est = {sabe: "lo hace", parcial: "a medias", falta: "le falta"};
    h += `<section class="panel"><h2>Habilidades</h2><div class="tabla"><table><thead><tr><th>Lo que pagan las empresas</th><th>Vivi</th><th>Qué hace</th><th>Qué le falta</th></tr></thead><tbody>
      ${hb.mapa.map(m => `<tr><td>${esc(m.nombre)}</td><td><span class="chip ${m.estado === "falta" ? "baja" : ""}">${est[m.estado] || esc(m.estado)}</span></td><td>${esc(m.hace) || "—"}</td><td>${esc(m.falta)}</td></tr>`).join("")}
      </tbody></table></div>
      ${ap.length ? `<div class="etq" style="margin-top:14px">Quiere aprender</div><ul class="lista">${ap.map(a => `<li><b>${fecha(a.fecha)}</b> ${esc(a.habilidad)} — ${esc(a.para_que)}</li>`).join("")}</ul>` : ""}
    </section>`;
  }
  if ((d.ml || []).length) h += `<section class="panel"><h2>Publicaciones en Mercado Libre</h2><div class="tabla"><table>
    <thead><tr><th>Producto</th><th class="n">Precio</th><th class="n">Visitas 7 d</th><th class="n">Totales</th><th>Estado</th></tr></thead><tbody>
    ${d.ml.map(f => `<tr><td>${f.enlace ? `<a href="${esc(f.enlace)}" rel="noopener">${esc(f.clave)}</a>` : esc(f.clave)}</td><td class="n">${ars(f.precio)}</td>
      <td class="n">${f.visitas7 ?? "—"}</td><td class="n">${f.visitas ?? "—"}</td>
      <td>${f.baja ? `<span class="chip baja">${esc(f.baja.estado)}${f.baja.motivo ? " · " + esc(f.baja.motivo) : ""}</span>` : '<span class="chip">activa</span>'}</td></tr>`).join("")}
    </tbody></table></div></section>`;
  h += `<section class="panel"><h2>Sus negocios</h2><div class="tabla"><table><thead><tr><th>Negocio</th><th>Estado</th><th class="n">Ventas</th><th class="n">Neto</th><th>Detalle</th></tr></thead><tbody>
    ${(d.negocios || []).map(n => `<tr><td>${esc(n.nombre)}</td><td>${esc(n.estado)}</td><td class="n">${Number(n.ventas).toFixed(2)}</td><td class="n">${Number(n.neto).toFixed(2)}</td><td>${esc(n.detalle)}</td></tr>`).join("")}
    </tbody></table></div></section>`;
  if ((dr.hechos || []).length) h += `<section class="panel"><h2>Lo que hizo sola el ${fecha(dr.fecha)}</h2><ul class="lista">${dr.hechos.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>`;
  $("#contenido").innerHTML = h;
  $("#contenido").hidden = false;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button.copiar[data-c]"); if (!b) return;
  const t = document.getElementById(b.dataset.c).textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => b.textContent = "Copiado", () => {
    const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(document.getElementById(b.dataset.c)); s.removeAllRanges(); s.addRange(rg);
  });
});

async function arrancar(k) {
  try {
    const d = await abrir(k);
    guardar(k); $("#llave").hidden = true; pintar(d);
    if (location.hash) history.replaceState(null, "", location.pathname);
  } catch (e) {
    $("#visto").textContent = ""; $("#llave").hidden = false; $("#error").textContent = e.message;
  }
}
$("#llave").addEventListener("submit", e => { e.preventDefault(); arrancar(deEnlace($("#clave").value)); });
const k = deEnlace(location.hash) || guardada();
if (k) arrancar(k); else { $("#visto").textContent = ""; $("#llave").hidden = false; }
setInterval(() => { const k = guardada(); if (k && !document.hidden) abrir(k).then(pintar, () => {}); }, 5 * 60 * 1000);
</script>
</body>
</html>
